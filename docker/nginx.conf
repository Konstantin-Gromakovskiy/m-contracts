server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css;

  # Спека маленькая и меняется на каждый деплой — отдаём с обязательной
  # ревалидацией, чтобы Scalar всегда показывал актуальный контракт.
  location ~ ^/openapi\..+\.json$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # scalar.js — стабильное имя (не контент-хэш), поэтому НЕ immutable:
  # при бампе версии Scalar образ пересобирается, ETag меняется → ревалидация.
  location = /scalar.js {
    try_files $uri =404;
  }

  # Scalar — статический SPA; недостающее отдаём index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
